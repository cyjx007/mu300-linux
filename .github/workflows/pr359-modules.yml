name: pr359 modules

# Builds the two modules PR #359 touches, for 7.2.11, and uploads them as an artifact.
# Pushed on branch pr359 so it starts by itself: the upstream mainline.yml uploads nothing.

on:
  push:
    branches: [pr359]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Build environment
        run: docker build -t mu300-mainline-build upstream/

      - name: Kernel 7.2.11
        env:
          KV: "7.2.11"
        run: |
          docker volume create mu300-mainline
          docker run --rm -e KV="$KV" -v mu300-mainline:/src -v "$PWD/upstream":/work \
            mu300-mainline-build bash /work/build.sh

      - name: The two vendor modules
        env:
          KV: "7.2.11"
        run: |
          docker run --rm -e KV="$KV" -v mu300-mainline:/src -v "$PWD/upstream":/work \
            mu300-mainline-build bash /work/build-modules.sh wcn_bsp sprd_wlan_combo
          ls -l upstream/out/modules/wcn_bsp.ko upstream/out/modules/sprd_wlan_combo.ko

      - name: Collect them
        run: |
          mkdir -p out
          cp upstream/out/modules/wcn_bsp.ko upstream/out/modules/sprd_wlan_combo.ko out/
          cd out
          sha256sum ./*.ko | tee SHA256SUMS
          for f in ./*.ko; do
            echo "$f  patched-markers=$(strings "$f" | grep -c 'full, backpressure')"
            strings "$f" | grep -m1 'vermagic=' || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: modules-7.2.11
          path: out/
